# Maniac Mansion (NES) port configuration (example). Copy to
# ~/.config/maniac-mansion-port/config.ini, or pass --config FILE.
# Precedence: --set section.key=value > MM_<SECTION>_<KEY> environment
# variables (e.g. MM_VIDEO_SCALE=4) > this file. Defaults are the original
# game on an NTSC console; nothing here is an enhancement unless it says so.

[game]
# rom = /path/to/Maniac Mansion (USA).nes   # also $MM_ROM or launch.sh arg 1

[video]
scale = 3              # initial window size (integer multiple)
aspect = 8:7           # 8:7 (NTSC TV pixel shape) or square
overscan_crop = 0      # lines hidden at top and bottom (0..16); TVs hid ~8
fullscreen = off       # Alt+Enter toggles
vsync = on

[audio]
enabled = on
volume = 100           # 0..100
rate = 48000

[input]                # SDL key names
a = X
b = Z
select = Right Shift
start = Return
up = Up
down = Down
left = Left
right = Right

[dev]
dev_menu = on          # dev menu (F8 / Back+Start) is on in this preview;
                       # off hides it (also MM_DEV_MENU=0); MM_CHEATS=0 disables it

[enhancements]
; Only used in Enhanced / Remastered mode. Original ignores these settings.
; Original is selected by default each boot; game mode is never remembered.
hold_walk = off       # hold A: update only native Walk-to; no faster timers
object_snap = off     # D-pad/arrows: visible targets; B+direction: free cursor
quick_verbs = off     # Select tap: native; hold: host chooser (after pad chord grace)
smooth_display = off  # host deadline pacing; simulation remains NTSC
graphics_sample = off
# Replacement is Enhanced-only, at the starting road; Dave remains required.
kid_switching = off # reversible scene-color sample; native UI unchanged
